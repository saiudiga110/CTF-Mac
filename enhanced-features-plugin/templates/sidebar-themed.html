<style>
/* ============================================================
   LLOYDS CTF — CYBER THEME  |  Authenticated Pages
   Colors: Midnight #050505 · Lloyds Green #006341 · Neon #39FF14
   ============================================================ */

/* --- 1. DESIGN TOKENS ------------------------------------ */
:root {
  --lloyds-bg:        #050505;
  --lloyds-bg2:       #0d0d0d;
  --lloyds-sidebar:   rgba(6, 10, 8, 0.97);
  --lloyds-card:      rgba(13, 18, 15, 0.82);
  --lloyds-green:     #006341;
  --lloyds-green-l:   #008a59;
  --lloyds-neon:      #39FF14;
  --lloyds-cyber:     #00d4ff;
  --lloyds-text:      #e2e8e4;
  --lloyds-dim:       #8a9e94;
  --lloyds-muted:     #445548;
  --lloyds-border:    rgba(0, 99, 65, 0.28);
  --lloyds-glow:      0 0 18px rgba(0, 99, 65, 0.45);
  --lloyds-glow-neon: 0 0 12px rgba(57, 255, 20, 0.4);
  --sidebar-w:        260px;
  --font-mono:        'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  --font-ui:          'Inter', 'Segoe UI', system-ui, sans-serif;
  --trans:            0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

/* --- 2. KEYFRAMES ---------------------------------------- */
@keyframes cyber-scan {
  0%   { background-position: 0 0; }
  100% { background-position: 0 100vh; }
}
@keyframes glow-pulse {
  0%, 100% { box-shadow: 0 0 8px rgba(0,99,65,0.3); }
  50%       { box-shadow: 0 0 22px rgba(0,99,65,0.7); }
}
@keyframes neon-flicker {
  0%,19%,21%,23%,25%,54%,56%,100% { opacity: 1; }
  20%,24%,55%                      { opacity: 0.4; }
}
@keyframes slide-in {
  from { transform: translateX(-8px); opacity: 0; }
  to   { transform: translateX(0);    opacity: 1; }
}
@keyframes btn-scan {
  0%   { left: -100%; }
  100% { left: 120%; }
}

/* --- 3. GLOBAL RESET ------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--lloyds-bg);
  color: var(--lloyds-text);
  font-family: var(--font-ui);
  overflow-x: hidden;
  min-height: 100vh;
}

/* Cyber grid background on body */
body {
  background-color: var(--lloyds-bg);
  background-image:
    linear-gradient(rgba(0, 99, 65, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 99, 65, 0.035) 1px, transparent 1px);
  background-size: 52px 52px;
  background-attachment: fixed;
  display: flex;
  flex-direction: row;
  min-height: 100vh;
}

/* Scrollbar */
::-webkit-scrollbar              { width: 6px; height: 6px; }
::-webkit-scrollbar-track        { background: var(--lloyds-bg2); }
::-webkit-scrollbar-thumb        { background: var(--lloyds-green); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover  { background: var(--lloyds-green-l); }

/* --- 4. SIDEBAR (transform CTFd navbar) ------------------ */
nav.navbar {
  position: fixed !important;
  left: 0 !important; top: 0 !important;
  width: var(--sidebar-w) !important;
  height: 100vh !important;
  background: var(--lloyds-sidebar) !important;
  border-right: 1px solid var(--lloyds-border) !important;
  border-bottom: none !important;
  border-radius: 0 !important;
  flex-direction: column !important;
  display: flex !important;
  z-index: 1050 !important;
  overflow-y: auto !important;
  overflow-x: hidden !important;
  margin: 0 !important;
  padding: 0 !important;
  box-shadow: 2px 0 24px rgba(0,0,0,0.6), 1px 0 0 rgba(0,99,65,0.15) !important;
  backdrop-filter: blur(12px) !important;
  transition: transform var(--trans) !important;
}

/* Sidebar scrollbar */
nav.navbar::-webkit-scrollbar       { width: 4px; }
nav.navbar::-webkit-scrollbar-thumb { background: rgba(0,99,65,0.4); }

/* Brand / Logo */
.navbar-brand {
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  color: var(--lloyds-green) !important;
  background: rgba(0, 99, 65, 0.06) !important;
  border-bottom: 1px solid var(--lloyds-border) !important;
  padding: 18px 16px !important;
  margin: 0 !important;
  width: 100% !important;
  font-family: var(--font-mono) !important;
  font-size: 15px !important;
  font-weight: 700 !important;
  letter-spacing: 2px !important;
  text-transform: uppercase !important;
  text-decoration: none !important;
  transition: all var(--trans) !important;
  min-height: 72px !important;
}
.navbar-brand:hover {
  color: var(--lloyds-neon) !important;
  text-shadow: var(--lloyds-glow-neon) !important;
  background: rgba(0, 99, 65, 0.12) !important;
}
.navbar-brand img {
  max-height: 44px !important;
  width: auto !important;
  filter: brightness(1.1) drop-shadow(0 0 6px rgba(0,99,65,0.5)) !important;
  transition: filter var(--trans) !important;
}
.navbar-brand img:hover {
  filter: brightness(1.3) drop-shadow(0 0 14px rgba(57,255,20,0.5)) !important;
}

/* Collapse → vertical flex */
.navbar-collapse {
  display: flex !important;
  flex-direction: column !important;
  width: 100% !important;
  flex: 1 !important;
  padding: 12px 0 80px 0 !important;
  overflow-y: auto !important;
  overflow-x: hidden !important;
}

/* Nav list vertical */
.navbar-nav {
  display: flex !important;
  flex-direction: column !important;
  width: 100% !important;
  gap: 1px !important;
  margin: 0 !important;
}

/* Nav item */
.navbar-nav .nav-item {
  width: 100% !important;
  margin: 0 !important;
  list-style: none !important;
  animation: slide-in 0.3s ease both !important;
}

/* Nav link */
.navbar-nav .nav-link {
  display: flex !important;
  align-items: center !important;
  padding: 12px 18px !important;
  color: var(--lloyds-dim) !important;
  font-size: 13px !important;
  font-weight: 500 !important;
  font-family: var(--font-ui) !important;
  text-decoration: none !important;
  border-left: 3px solid transparent !important;
  transition: all var(--trans) !important;
  position: relative !important;
  white-space: nowrap !important;
  overflow: hidden !important;
  letter-spacing: 0.3px !important;
}
.navbar-nav .nav-link::after {
  content: '' !important;
  position: absolute !important;
  inset: 0 !important;
  background: linear-gradient(90deg, rgba(0,99,65,0.08) 0%, transparent 100%) !important;
  opacity: 0 !important;
  transition: opacity var(--trans) !important;
}
.navbar-nav .nav-link:hover {
  color: var(--lloyds-text) !important;
  border-left-color: var(--lloyds-green) !important;
  background: rgba(0, 99, 65, 0.1) !important;
  padding-left: 22px !important;
}
.navbar-nav .nav-link:hover::after { opacity: 1 !important; }

.navbar-nav .nav-link.active,
.navbar-nav .nav-item.active .nav-link {
  color: var(--lloyds-neon) !important;
  border-left-color: var(--lloyds-neon) !important;
  background: rgba(57, 255, 20, 0.06) !important;
  text-shadow: var(--lloyds-glow-neon) !important;
  font-weight: 600 !important;
}

/* Nav icons */
.navbar-nav .nav-link i,
.navbar-nav .nav-link svg {
  margin-right: 10px !important;
  width: 18px !important;
  text-align: center !important;
  color: var(--lloyds-green) !important;
  font-size: 14px !important;
  flex-shrink: 0 !important;
  transition: color var(--trans) !important;
}
.navbar-nav .nav-link:hover i { color: var(--lloyds-neon) !important; }

/* Dropdown */
.navbar-toggler { display: none !important; }
.navbar-nav .dropdown-menu {
  position: static !important;
  float: none !important;
  width: 100% !important;
  background: rgba(0,99,65,0.05) !important;
  border: none !important;
  border-left: 2px solid var(--lloyds-border) !important;
  border-radius: 0 !important;
  padding: 0 !important;
  margin: 0 !important;
  box-shadow: none !important;
}
.navbar-nav .dropdown-menu .dropdown-item {
  padding: 10px 18px 10px 36px !important;
  color: var(--lloyds-dim) !important;
  font-size: 12px !important;
  transition: all var(--trans) !important;
  background: transparent !important;
}
.navbar-nav .dropdown-menu .dropdown-item:hover {
  color: var(--lloyds-green-l) !important;
  background: rgba(0,99,65,0.1) !important;
  padding-left: 42px !important;
}

/* Sidebar section divider text */
nav.navbar .navbar-text,
nav.navbar .sidebar-section {
  padding: 16px 18px 6px 18px !important;
  font-size: 10px !important;
  font-family: var(--font-mono) !important;
  font-weight: 700 !important;
  letter-spacing: 2px !important;
  text-transform: uppercase !important;
  color: var(--lloyds-muted) !important;
  border-top: 1px solid rgba(0,99,65,0.12) !important;
  margin-top: 8px !important;
  display: block !important;
}

/* Status dot on brand */
.navbar-brand::before {
  content: '' !important;
  display: inline-block !important;
  width: 7px !important;
  height: 7px !important;
  background: var(--lloyds-neon) !important;
  border-radius: 50% !important;
  margin-right: 8px !important;
  animation: glow-pulse 2s infinite !important;
  flex-shrink: 0 !important;
}

/* --- 5. MAIN CONTENT ------------------------------------- */
/* Override base.html --navbar-height so no top gap appears */
:root { --navbar-height: 0px; --sidebar-width: var(--sidebar-w); }

main, [role="main"] {
  margin-left: var(--sidebar-w) !important;
  margin-top: 0 !important;
  width: calc(100% - var(--sidebar-w)) !important;
  min-height: 100vh !important;
  padding: 28px 32px !important;
  background: transparent !important;
  flex: 1 !important;
  display: flex !important;
  flex-direction: column !important;
}

/* --- 6. TYPOGRAPHY --------------------------------------- */
h1, h2, h3, h4, h5, h6 {
  color: var(--lloyds-text) !important;
  font-family: var(--font-ui) !important;
}
h1, h2 {
  font-weight: 700 !important;
  letter-spacing: -0.3px !important;
}
h1::after, .page-title::after {
  content: '_' !important;
  color: var(--lloyds-neon) !important;
  animation: neon-flicker 4s infinite !important;
  margin-left: 2px !important;
}
code, pre, .font-monospace {
  font-family: var(--font-mono) !important;
  color: var(--lloyds-neon) !important;
  background: rgba(57,255,20,0.06) !important;
  border: 1px solid rgba(57,255,20,0.15) !important;
  border-radius: 3px !important;
  padding: 1px 5px !important;
}
pre { padding: 12px !important; }
a { color: var(--lloyds-green-l) !important; transition: color var(--trans) !important; }
a:hover { color: var(--lloyds-neon) !important; }

/* --- 7. CARDS / PANELS ----------------------------------- */
.card, .jumbotron, .panel {
  background: var(--lloyds-card) !important;
  border: 1px solid var(--lloyds-border) !important;
  border-radius: 6px !important;
  backdrop-filter: blur(10px) !important;
  box-shadow: 0 4px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(0,99,65,0.08) !important;
  color: var(--lloyds-text) !important;
}
.card-header, .panel-heading {
  background: rgba(0, 99, 65, 0.1) !important;
  border-bottom: 1px solid var(--lloyds-border) !important;
  color: var(--lloyds-text) !important;
  font-family: var(--font-mono) !important;
  font-size: 13px !important;
  font-weight: 600 !important;
  letter-spacing: 0.5px !important;
  padding: 12px 16px !important;
}
.card-body { padding: 18px !important; }
.card-footer {
  background: rgba(0,99,65,0.05) !important;
  border-top: 1px solid var(--lloyds-border) !important;
}

/* --- 8. TABLES ------------------------------------------- */
.table, table {
  color: var(--lloyds-text) !important;
  border-color: var(--lloyds-border) !important;
}
.table thead th, table thead th {
  background: rgba(0, 99, 65, 0.15) !important;
  color: var(--lloyds-green-l) !important;
  border-bottom: 1px solid var(--lloyds-border) !important;
  font-family: var(--font-mono) !important;
  font-size: 11px !important;
  letter-spacing: 1px !important;
  text-transform: uppercase !important;
  font-weight: 600 !important;
  padding: 10px 14px !important;
}
.table tbody tr, table tbody tr {
  border-bottom: 1px solid rgba(0,99,65,0.08) !important;
  transition: background var(--trans) !important;
}
.table tbody tr:hover, table tbody tr:hover {
  background: rgba(0, 99, 65, 0.07) !important;
}
.table td, table td {
  border-color: rgba(0,99,65,0.1) !important;
  color: var(--lloyds-text) !important;
  vertical-align: middle !important;
  padding: 10px 14px !important;
}
.table-striped tbody tr:nth-of-type(odd) {
  background: rgba(0,99,65,0.04) !important;
}

/* --- 9. FORMS -------------------------------------------- */
.form-control, .form-select, input[type="text"],
input[type="password"], input[type="email"],
input[type="number"], textarea, select {
  background: rgba(0, 0, 0, 0.55) !important;
  border: 1px solid rgba(0, 99, 65, 0.4) !important;
  color: var(--lloyds-text) !important;
  border-radius: 4px !important;
  padding: 9px 13px !important;
  font-family: var(--font-mono) !important;
  font-size: 13px !important;
  transition: border-color var(--trans), box-shadow var(--trans) !important;
}
.form-control:focus, .form-select:focus,
input[type="text"]:focus, input[type="password"]:focus,
input[type="email"]:focus, textarea:focus, select:focus {
  background: rgba(0, 0, 0, 0.7) !important;
  border-color: var(--lloyds-green) !important;
  box-shadow: 0 0 0 3px rgba(0,99,65,0.18), var(--lloyds-glow) !important;
  outline: none !important;
  color: var(--lloyds-text) !important;
}
.form-control::placeholder { color: var(--lloyds-muted) !important; }
label, .form-label { color: var(--lloyds-dim) !important; font-size: 12px !important; font-weight: 600 !important; letter-spacing: 0.5px !important; text-transform: uppercase !important; }

/* --- 10. BUTTONS ----------------------------------------- */
.btn, button[type="submit"] {
  position: relative !important;
  overflow: hidden !important;
  border-radius: 4px !important;
  font-family: var(--font-mono) !important;
  font-size: 12px !important;
  font-weight: 600 !important;
  letter-spacing: 1.5px !important;
  text-transform: uppercase !important;
  transition: all var(--trans) !important;
  cursor: pointer !important;
}
.btn::before {
  content: '' !important;
  position: absolute !important;
  top: 0 !important; left: -100% !important;
  width: 40% !important; height: 100% !important;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent) !important;
  transition: none !important;
}
.btn:hover::before { animation: btn-scan 0.55s ease !important; }

.btn-primary, .btn-success {
  background: var(--lloyds-green) !important;
  border-color: var(--lloyds-green) !important;
  color: #fff !important;
}
.btn-primary:hover, .btn-success:hover {
  background: var(--lloyds-green-l) !important;
  border-color: var(--lloyds-green-l) !important;
  box-shadow: var(--lloyds-glow) !important;
  color: #fff !important;
  transform: translateY(-1px) !important;
}
.btn-secondary, .btn-outline-secondary {
  background: transparent !important;
  border: 1px solid var(--lloyds-border) !important;
  color: var(--lloyds-dim) !important;
}
.btn-secondary:hover {
  border-color: var(--lloyds-green) !important;
  color: var(--lloyds-green-l) !important;
  background: rgba(0,99,65,0.1) !important;
}
.btn-danger { background: #8b1a1a !important; border-color: #8b1a1a !important; color: #ffcccc !important; }
.btn-danger:hover { background: #b22222 !important; box-shadow: 0 0 15px rgba(139,26,26,0.5) !important; transform: translateY(-1px) !important; }
.btn-outline-primary {
  background: transparent !important;
  border: 1px solid var(--lloyds-green) !important;
  color: var(--lloyds-green-l) !important;
}
.btn-outline-primary:hover {
  background: var(--lloyds-green) !important;
  color: #fff !important;
  box-shadow: var(--lloyds-glow) !important;
}

/* --- 11. BADGES / PILLS ---------------------------------- */
.badge, .badge-primary {
  background: rgba(0,99,65,0.25) !important;
  color: var(--lloyds-neon) !important;
  border: 1px solid rgba(57,255,20,0.3) !important;
  font-family: var(--font-mono) !important;
  font-size: 10px !important;
  letter-spacing: 0.5px !important;
  border-radius: 3px !important;
  padding: 3px 7px !important;
}
.badge-secondary { background: rgba(0,0,0,0.4) !important; color: var(--lloyds-dim) !important; border-color: var(--lloyds-border) !important; }
.badge-danger, .badge-red { background: rgba(139,26,26,0.3) !important; color: #ff8888 !important; border-color: rgba(139,26,26,0.4) !important; }
.badge-success { background: rgba(0,99,65,0.3) !important; color: var(--lloyds-neon) !important; border-color: var(--lloyds-border) !important; }

/* --- 12. ALERTS ------------------------------------------ */
.alert {
  background: rgba(13,18,15,0.9) !important;
  border-radius: 4px !important;
  font-size: 13px !important;
}
.alert-success { border-left: 3px solid var(--lloyds-neon) !important; color: var(--lloyds-neon) !important; border-top-color: rgba(57,255,20,0.2) !important; border-right-color: rgba(57,255,20,0.2) !important; border-bottom-color: rgba(57,255,20,0.2) !important; }
.alert-danger  { border-left: 3px solid #ff4444 !important; color: #ff8888 !important; }
.alert-warning { border-left: 3px solid #ffaa00 !important; color: #ffcc55 !important; }
.alert-info    { border-left: 3px solid var(--lloyds-cyber) !important; color: var(--lloyds-cyber) !important; }

/* --- 13. MODALS ------------------------------------------ */
.modal-content {
  background: #0d0d0d !important;
  border: 1px solid var(--lloyds-border) !important;
  border-radius: 6px !important;
  box-shadow: 0 20px 60px rgba(0,0,0,0.8) !important;
  color: var(--lloyds-text) !important;
}
.modal-header {
  border-bottom: 1px solid var(--lloyds-border) !important;
  background: rgba(0,99,65,0.08) !important;
}
.modal-footer { border-top: 1px solid var(--lloyds-border) !important; }
.modal-backdrop { background-color: rgba(0,0,0,0.7) !important; }

/* --- 14. NAVBAR / TOPBAR elements hidden ------------------ */
.navbar-toggler-icon { background-image: none !important; }
.navbar-toggler { display: none !important; }

/* --- 15. CHALLENGE CARDS --------------------------------- */
.challenge-button, [data-type="challenge"],
div[data-challengeid] {
  background: rgba(0, 55, 30, 0.85) !important;
  border: 1px solid rgba(0, 99, 65, 0.5) !important;
  border-radius: 6px !important;
  color: var(--lloyds-text) !important;
  transition: all var(--trans) !important;
  cursor: pointer !important;
  position: relative !important;
  overflow: hidden !important;
}
.challenge-button:hover,
div[data-challengeid]:hover {
  border-color: var(--lloyds-green) !important;
  box-shadow: var(--lloyds-glow), 0 8px 24px rgba(0,0,0,0.4) !important;
  transform: translateY(-2px) !important;
}
.challenge-button.solved {
  border-color: var(--lloyds-neon) !important;
  background: rgba(57,255,20,0.06) !important;
}

/* --- 16. SCORE / LEADERBOARD ----------------------------- */
.score-graph, .score-page { color: var(--lloyds-text) !important; }
.chart-container canvas { filter: saturate(0.9) !important; }

/* --- 17. TABS -------------------------------------------- */
.nav-tabs {
  border-bottom: 1px solid var(--lloyds-border) !important;
  gap: 2px !important;
}
.nav-tabs .nav-link {
  color: var(--lloyds-dim) !important;
  background: transparent !important;
  border: 1px solid transparent !important;
  border-radius: 4px 4px 0 0 !important;
  font-family: var(--font-mono) !important;
  font-size: 12px !important;
  letter-spacing: 0.5px !important;
  padding: 8px 16px !important;
  transition: all var(--trans) !important;
}
.nav-tabs .nav-link:hover { color: var(--lloyds-text) !important; border-color: var(--lloyds-border) var(--lloyds-border) transparent !important; }
.nav-tabs .nav-link.active {
  color: var(--lloyds-neon) !important;
  background: rgba(57,255,20,0.05) !important;
  border-color: var(--lloyds-border) var(--lloyds-border) transparent !important;
  border-bottom-color: var(--lloyds-bg) !important;
}

/* --- 18. PAGINATION -------------------------------------- */
.pagination .page-link {
  background: var(--lloyds-card) !important;
  border-color: var(--lloyds-border) !important;
  color: var(--lloyds-dim) !important;
  font-family: var(--font-mono) !important;
  transition: all var(--trans) !important;
}
.pagination .page-link:hover { background: rgba(0,99,65,0.2) !important; color: var(--lloyds-neon) !important; border-color: var(--lloyds-green) !important; }
.pagination .page-item.active .page-link { background: var(--lloyds-green) !important; border-color: var(--lloyds-green) !important; color: #fff !important; }

/* --- 19. FOOTER ------------------------------------------ */
footer, .footer {
  margin-left: var(--sidebar-w) !important;
  background: rgba(5,5,5,0.95) !important;
  border-top: 1px solid var(--lloyds-border) !important;
  color: var(--lloyds-muted) !important;
  font-family: var(--font-mono) !important;
  font-size: 11px !important;
  padding: 12px 32px !important;
  text-align: center !important;
}
footer a, .footer a { color: var(--lloyds-muted) !important; }
footer a:hover, .footer a:hover { color: var(--lloyds-green-l) !important; }

/* --- 20. PAGE HEADER ------------------------------------ */
.jumbotron { background: var(--lloyds-card) !important; }
.container-fluid { background: transparent !important; }

/* --- 21. PROGRESS BARS ---------------------------------- */
.progress {
  background: rgba(0,99,65,0.1) !important;
  border-radius: 2px !important;
  height: 6px !important;
}
.progress-bar {
  background: linear-gradient(90deg, var(--lloyds-green), var(--lloyds-neon)) !important;
}

/* --- 22. SELECTION --------------------------------------- */

</style>

<script>
(function () {
  'use strict';

  // ── Wait for DOM ───────────────────────────────────────────────────────────
  function ready(fn) {
    if (document.readyState !== 'loading') fn();
    else document.addEventListener('DOMContentLoaded', fn);
  }

  ready(function () {

    // ── Inject mobile hamburger ──────────────────────────────────────────────
    var hamburger = document.createElement('button');
    hamburger.id = 'lloyds-hamburger';
    hamburger.setAttribute('aria-label', 'Toggle navigation');
    hamburger.innerHTML = '<span></span><span></span><span></span>';
    hamburger.style.cssText = [
      'position:fixed', 'top:14px', 'left:14px', 'z-index:1060',
      'background:rgba(0,99,65,0.9)', 'border:1px solid rgba(57,255,20,0.3)',
      'border-radius:4px', 'cursor:pointer', 'padding:8px 10px',
      'display:none', 'flex-direction:column', 'gap:5px',
      'transition:all 0.25s ease'
    ].join(';');

    var spans = hamburger.querySelectorAll('span');
    spans.forEach(function (s) {
      s.style.cssText = 'display:block;width:20px;height:2px;background:#39FF14;border-radius:1px;transition:all 0.25s ease';
    });

    // Overlay for mobile
    var overlay = document.createElement('div');
    overlay.className = 'sidebar-overlay';
    document.body.appendChild(overlay);
    document.body.appendChild(hamburger);

    // ── Toggle sidebar on mobile ─────────────────────────────────────────────
    var sidebar = document.querySelector('nav.navbar');
    function openSidebar() {
      if (sidebar) sidebar.classList.add('mobile-open');
      overlay.classList.add('show');
      hamburger.style.left = '274px';
    }
    function closeSidebar() {
      if (sidebar) sidebar.classList.remove('mobile-open');
      overlay.classList.remove('show');
      hamburger.style.left = '14px';
    }

    hamburger.addEventListener('click', function () {
      if (sidebar && sidebar.classList.contains('mobile-open')) closeSidebar();
      else openSidebar();
    });
    overlay.addEventListener('click', closeSidebar);

    // Close on mobile nav link click
    document.querySelectorAll('nav.navbar .nav-link').forEach(function (link) {
      link.addEventListener('click', function () {
        if (window.innerWidth <= 768) closeSidebar();
      });
    });

    // Show hamburger on mobile
    function checkViewport() {
      hamburger.style.display = window.innerWidth <= 768 ? 'flex' : 'none';
    }
    checkViewport();
    window.addEventListener('resize', checkViewport);

    // ── Active link detection ────────────────────────────────────────────────
    var currentPath = window.location.pathname;
    document.querySelectorAll('nav.navbar .nav-link').forEach(function (link) {
      var href = link.getAttribute('href') || '';
      if (href && href !== '/' && currentPath.startsWith(href)) {
        link.classList.add('active');
      } else if (href === '/' && currentPath === '/') {
        link.classList.add('active');
      }
    });

    // ── Inject Lloyds brand tagline ─────────────────────────────────────────
    var brand = document.querySelector('.navbar-brand');
    if (brand && !brand.querySelector('.brand-tagline')) {
      var tagline = document.createElement('div');
      tagline.className = 'brand-tagline';
      tagline.style.cssText = [
        'font-size:9px', 'color:rgba(57,255,20,0.6)',
        'letter-spacing:3px', 'text-transform:uppercase',
        'font-family:monospace', 'margin-top:2px',
        'font-weight:400'
      ].join(';');
      tagline.textContent = 'CTF PLATFORM';
      // If brand has text (not just image), add tagline
      if (!brand.querySelector('img')) {
        brand.style.flexDirection = 'column';
        brand.appendChild(tagline);
      }
    }

    // ── Theme toggle button ─────────────────────────────────────────────────
    var themeBtn = document.createElement('button');
    themeBtn.id = 'lloyds-theme-btn';
    themeBtn.setAttribute('aria-label', 'Toggle color mode');
    themeBtn.style.cssText = [
      'position:fixed', 'bottom:20px', 'left:' + (window.innerWidth > 768 ? '210px' : '14px'),
      'width:38px', 'height:38px', 'border-radius:50%',
      'background:rgba(0,99,65,0.85)', 'border:1px solid rgba(0,99,65,0.5)',
      'color:#fff', 'font-size:16px', 'cursor:pointer',
      'z-index:1051', 'display:flex', 'align-items:center',
      'justify-content:center', 'transition:all 0.25s ease',
      'box-shadow:0 0 12px rgba(0,99,65,0.4)'
    ].join(';');

    var savedMode = localStorage.getItem('lloyds-mode') || 'dark';
    themeBtn.textContent = savedMode === 'light' ? '🌙' : '☀️';
    document.body.appendChild(themeBtn);

    // Update theme btn position on resize
    window.addEventListener('resize', function () {
      themeBtn.style.left = window.innerWidth > 768 ? '210px' : '14px';
    });

    themeBtn.addEventListener('click', function () {
      var isLight = document.body.classList.contains('lloyds-light');
      if (isLight) {
        document.body.classList.remove('lloyds-light');
        localStorage.setItem('lloyds-mode', 'dark');
        themeBtn.textContent = '☀️';
      } else {
        document.body.classList.add('lloyds-light');
        localStorage.setItem('lloyds-mode', 'light');
        themeBtn.textContent = '🌙';
      }
    });

    // Restore saved mode
    if (savedMode === 'light') document.body.classList.add('lloyds-light');

    // ── Scan line effect on primary buttons ─────────────────────────────────
    document.querySelectorAll('.btn-primary, button[type="submit"]').forEach(function (btn) {
      btn.addEventListener('mouseenter', function () {
        this.style.boxShadow = '0 0 20px rgba(0,99,65,0.5)';
      });
      btn.addEventListener('mouseleave', function () {
        this.style.boxShadow = '';
      });
    });

    // ── Security: hide admin section for non-admin ───────────────────────────
    // (Admin stripping is handled server-side in plugin __init__.py)

  }); // end ready

}());
</script>
