<style>
/* ========================================
   LLOYDS CTF - PREMIUM SIDEBAR LAYOUT
   Enhanced UI with Best Responsive Design
   ======================================== */

:root {
  --sidebar-width: 290px;
  --sidebar-bg: #0a1428;
  --sidebar-border: #00d4aa;
  --sidebar-hover: rgba(0, 212, 170, 0.15);
  --sidebar-text: #e0e0e0;
  --sidebar-accent: #00d4aa;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ===== SIDEBAR STYLING ===== */
nav.navbar {
  position: fixed !important;
  left: 0 !important;
  top: 0 !important;
  width: var(--sidebar-width) !important;
  height: 100vh !important;
  background: linear-gradient(135deg, var(--sidebar-bg) 0%, #0f1a2e 100%) !important;
  border-right: 3px solid var(--sidebar-border) !important;
  border-bottom: none !important;
  margin: 0 !important;
  padding: 0 !important;
  flex-direction: column !important;
  display: flex !important;
  z-index: 1050 !important;
  overflow-y: auto !important;
  overflow-x: hidden !important;
  box-shadow: 4px 0 25px rgba(0, 0, 0, 0.8) !important;
}

/* Scrollbar */
nav.navbar::-webkit-scrollbar {
  width: 8px !important;
}

nav.navbar::-webkit-scrollbar-track {
  background: rgba(0, 212, 170, 0.05) !important;
}

nav.navbar::-webkit-scrollbar-thumb {
  background: var(--sidebar-accent) !important;
  border-radius: 4px !important;
  opacity: 0.7 !important;
}

nav.navbar::-webkit-scrollbar-thumb:hover {
  opacity: 1 !important;
}

/* Brand Section */
.navbar-brand {
  color: var(--sidebar-accent) !important;
  font-weight: 900 !important;
  font-size: 20px !important;
  padding: 22px 16px !important;
  text-align: center !important;
  border-bottom: 2px solid rgba(0, 212, 170, 0.25) !important;
  margin: 0 !important;
  width: 100% !important;
  letter-spacing: 2px !important;
  text-transform: uppercase !important;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5) !important;
  transition: all var(--transition) !important;
}

.navbar-brand:hover {
  color: #ffffff !important;
  text-shadow: 0 0 15px rgba(0, 212, 170, 0.6) !important;
}

.navbar-brand img {
  max-width: 85% !important;
  height: 55px !important;
  filter: brightness(1.3) drop-shadow(0 0 8px rgba(0, 212, 170, 0.4)) !important;
  transition: filter var(--transition) !important;
}

.navbar-brand img:hover {
  filter: brightness(1.5) drop-shadow(0 0 15px rgba(0, 212, 170, 0.8)) !important;
}

/* Navigation Container */
.navbar-collapse {
  display: flex !important;
  flex-direction: column !important;
  width: 100% !important;
  flex: 1 !important;
  padding: 15px 0 !important;
  overflow-y: auto !important;
}

.navbar-nav {
  display: flex !important;
  flex-direction: column !important;
  width: 100% !important;
  gap: 0 !important;
  margin: 0 !important;
  flex: 1 !important;
}

/* Navigation Items */
.navbar-nav .nav-item {
  width: 100% !important;
  margin: 0 !important;
  display: flex !important;
  list-style: none !important;
}

.navbar-nav .nav-link {
  display: flex !important;
  align-items: center !important;
  justify-content: flex-start !important;
  color: var(--sidebar-text) !important;
  padding: 14px 18px !important;
  text-decoration: none !important;
  transition: all var(--transition) !important;
  border-left: 4px solid transparent !important;
  width: 100% !important;
  margin: 0 !important;
  font-size: 14px !important;
  font-weight: 600 !important;
  position: relative !important;
  box-sizing: border-box !important;
}

.navbar-nav .nav-link::before {
  content: '' !important;
  position: absolute !important;
  left: 0 !important;
  top: 50% !important;
  transform: translateY(-50%) !important;
  width: 4px !important;
  height: 0 !important;
  background: var(--sidebar-accent) !important;
  transition: height var(--transition) !important;
}

.navbar-nav .nav-link:hover {
  background: var(--sidebar-hover) !important;
  color: #ffffff !important;
  border-left-color: var(--sidebar-accent) !important;
  padding-left: 18px !important;
}

.navbar-nav .nav-link:hover::before {
  height: 70% !important;
}

.navbar-nav .nav-link.active {
  background: rgba(0, 212, 170, 0.2) !important;
  color: var(--sidebar-accent) !important;
  border-left-color: var(--sidebar-accent) !important;
}

.navbar-nav .nav-link i {
  margin-right: 12px !important;
  width: 20px !important;
  text-align: center !important;
  color: var(--sidebar-accent) !important;
  font-size: 16px !important;
  transition: all var(--transition) !important;
}

.navbar-nav .nav-link:hover i {
  transform: scale(1.1) !important;
}

/* Toggler */
.navbar-toggler {
  display: none !important;
}

/* Dropdowns */
.navbar-nav .dropdown-menu {
  position: static !important;
  float: none !important;
  width: 100% !important;
  padding: 0 !important;
  margin: 0 !important;
  border: none !important;
  background: rgba(0, 212, 170, 0.08) !important;
  box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.3) !important;
}

.navbar-nav .dropdown-menu .dropdown-item {
  padding: 11px 18px 11px 50px !important;
  color: var(--sidebar-text) !important;
  transition: all var(--transition) !important;
  font-size: 13px !important;
  font-weight: 500 !important;
}

.navbar-nav .dropdown-menu .dropdown-item:hover {
  background: rgba(0, 212, 170, 0.25) !important;
  color: var(--sidebar-accent) !important;
  border-left: 3px solid var(--sidebar-accent) !important;
  padding-left: 47px !important;
}

/* ===== BODY LAYOUT ===== */
html, body {
  margin: 0 !important;
  padding: 0 !important;
  overflow-x: hidden !important;
  background: #f5f7fa !important;
}

body {
  display: flex !important;
  flex-direction: row !important;
  min-height: 100vh !important;
}

nav.navbar {
  flex-shrink: 0 !important;
}

main {
  flex: 1 !important;
  margin-left: 0 !important;
  margin-top: 0 !important;
  width: auto !important;
  overflow-y: auto !important;
  padding: 30px !important;
  background: linear-gradient(135deg, #f5f7fa 0%, #ffffff 100%) !important;
}

footer {
  margin-left: 0 !important;
  width: 100% !important;
  border-top: 1px solid rgba(0, 212, 170, 0.2) !important;
}

/* Dividers */
nav.navbar hr {
  background-color: rgba(0, 212, 170, 0.3) !important;
  margin: 12px 0 !important;
  border: none !important;
  height: 1px !important;
}

/* Badges */
.badge {
  font-size: 11px !important;
  padding: 4px 8px !important;
  background: rgba(0, 212, 170, 0.3) !important;
  color: var(--sidebar-accent) !important;
  border: 1px solid rgba(0, 212, 170, 0.5) !important;
  border-radius: 3px !important;
}

/* ===== LOGIN/AUTH PAGE STYLING ===== */
body.auth-page {
  background: linear-gradient(135deg, #0a1428 0%, #0f1a2e 50%, #1a2842 100%) !important;
  justify-content: center !important;
  align-items: center !important;
}

body.auth-page nav.navbar {
  display: none !important;
}

body.auth-page main {
  width: 100% !important;
  margin: 0 !important;
  padding: 0 !important;
  background: transparent !important;
}

.auth-container,
.login-container,
.register-container {
  position: relative !important;
  z-index: 1 !important;
  background: rgba(10, 20, 40, 0.95) !important;
  border: 2px solid rgba(0, 212, 170, 0.3) !important;
  border-radius: 12px !important;
  padding: 45px !important;
  width: 100% !important;
  max-width: 450px !important;
  box-shadow: 0 8px 32px rgba(0, 212, 170, 0.15), 0 0 60px rgba(0, 0, 0, 0.6) !important;
  backdrop-filter: blur(10px) !important;
}

.auth-container h1,
.auth-container h2,
.login-container h1,
.login-container h2 {
  color: var(--sidebar-accent) !important;
  text-align: center !important;
  margin-bottom: 30px !important;
  font-size: 32px !important;
  font-weight: 800 !important;
  text-transform: uppercase !important;
  letter-spacing: 1.5px !important;
  text-shadow: 0 0 10px rgba(0, 212, 170, 0.3) !important;
}

/* Auth Tabs */
.auth-tabs {
  display: flex !important;
  gap: 0 !important;
  margin-bottom: 30px !important;
  border-bottom: 2px solid rgba(0, 212, 170, 0.2) !important;
}

.auth-tab {
  flex: 1 !important;
  padding: 14px !important;
  background: none !important;
  border: none !important;
  color: #999 !important;
  font-weight: 700 !important;
  cursor: pointer !important;
  transition: all var(--transition) !important;
  font-size: 14px !important;
  text-transform: uppercase !important;
  border-bottom: 3px solid transparent !important;
  margin-bottom: -2px !important;
}

.auth-tab.active {
  color: var(--sidebar-accent) !important;
  border-bottom-color: var(--sidebar-accent) !important;
}

.auth-tab:hover:not(.active) {
  color: #ccc !important;
}

/* Form Inputs */
.auth-container input,
.login-container input,
.register-container input {
  background: rgba(0, 20, 50, 0.7) !important;
  border: 1px solid rgba(0, 212, 170, 0.3) !important;
  color: #ffffff !important;
  padding: 12px 16px !important;
  margin-bottom: 16px !important;
  border-radius: 6px !important;
  font-size: 14px !important;
  transition: all var(--transition) !important;
}

.auth-container input:focus,
.login-container input:focus,
.register-container input:focus {
  background: rgba(0, 30, 70, 0.8) !important;
  border-color: var(--sidebar-accent) !important;
  box-shadow: 0 0 12px rgba(0, 212, 170, 0.3) !important;
  outline: none !important;
}

/* Buttons */
.auth-container button,
.login-container button,
.register-container button,
.btn-login,
.btn-register {
  background: linear-gradient(135deg, #00d4aa 0%, #00a885 100%) !important;
  color: #0a1428 !important;
  border: none !important;
  padding: 12px 24px !important;
  font-weight: 700 !important;
  font-size: 14px !important;
  border-radius: 6px !important;
  cursor: pointer !important;
  transition: all var(--transition) !important;
  width: 100% !important;
  text-transform: uppercase !important;
  letter-spacing: 1px !important;
  margin-top: 10px !important;
}

.auth-container button:hover,
.login-container button:hover,
.register-container button:hover,
.btn-login:hover,
.btn-register:hover {
  background: linear-gradient(135deg, #00e8c7 0%, #00d4aa 100%) !important;
  box-shadow: 0 0 20px rgba(0, 212, 170, 0.5) !important;
  transform: translateY(-2px) !important;
}

/* Links */
.auth-container a,
.login-container a,
.register-container a {
  color: var(--sidebar-accent) !important;
  text-decoration: none !important;
  transition: all var(--transition) !important;
}

.auth-container a:hover,
.login-container a:hover,
.register-container a:hover {
  color: #ffffff !important;
  text-decoration: underline !important;
}

/* ===== TABLET RESPONSIVE (1024px) ===== */
@media (max-width: 1024px) {
  nav.navbar {
    width: 260px !important;
  }

  .navbar-nav .nav-link {
    padding: 12px 14px !important;
    font-size: 13px !important;
  }

  main {
    padding: 25px !important;
  }

  .auth-container,
  .login-container,
  .register-container {
    padding: 40px 30px !important;
  }
}

/* ===== MOBILE RESPONSIVE (768px) ===== */
@media (max-width: 768px) {
  nav.navbar {
    position: fixed !important;
    width: 100% !important;
    height: auto !important;
    max-height: 65px !important;
    flex-direction: row !important;
    overflow-x: auto !important;
    overflow-y: hidden !important;
    border-right: none !important;
    border-bottom: 3px solid var(--sidebar-border) !important;
    top: 0 !important;
    left: 0 !important;
  }

  .navbar-brand {
    padding: 12px 15px !important;
    font-size: 15px !important;
    border-bottom: none !important;
    border-right: 2px solid rgba(0, 212, 170, 0.2) !important;
    white-space: nowrap !important;
    min-width: 140px !important;
    margin: 0 !important;
  }

  .navbar-brand img {
    height: 45px !important;
  }

  .navbar-collapse {
    flex-direction: row !important;
    padding: 0 !important;
    overflow-x: auto !important;
    overflow-y: hidden !important;
    scrollbar-width: thin !important;
  }

  .navbar-nav {
    flex-direction: row !important;
    gap: 0 !important;
  }

  .navbar-nav .nav-item {
    flex-shrink: 0 !important;
  }

  .navbar-nav .nav-link {
    padding: 10px 13px !important;
    font-size: 11px !important;
    white-space: nowrap !important;
    border: none !important;
    border-bottom: 3px solid transparent !important;
    border-left: none !important;
  }

  .navbar-nav .nav-link:hover {
    background: rgba(0, 212, 170, 0.2) !important;
    border-bottom-color: var(--sidebar-accent) !important;
    border-left: none !important;
  }

  .navbar-nav .nav-link::before {
    display: none !important;
  }

  .navbar-nav .nav-link i {
    margin-right: 5px !important;
    font-size: 14px !important;
  }

  main {
    margin-top: 65px !important;
    padding: 20px !important;
  }

  body {
    flex-direction: column !important;
  }

  /* Mobile dropdown */
  .navbar-nav .dropdown-menu {
    position: absolute !important;
    top: 65px !important;
    left: 0 !important;
    width: auto !important;
  }

  /* Mobile auth form */
  .auth-container,
  .login-container,
  .register-container {
    max-width: 95% !important;
    padding: 35px 25px !important;
    border-radius: 8px !important;
  }

  .auth-container h1,
  .auth-container h2,
  .login-container h1,
  .login-container h2 {
    font-size: 24px !important;
  }

  .auth-tab {
    padding: 12px !important;
    font-size: 12px !important;
  }
}

/* ===== EXTRA SMALL (480px) ===== */
@media (max-width: 480px) {
  .navbar-nav .nav-link {
    padding: 8px 10px !important;
    font-size: 9px !important;
  }

  .navbar-brand {
    font-size: 13px !important;
    padding: 8px 10px !important;
  }

  .navbar-brand img {
    height: 40px !important;
  }

  main {
    padding: 15px !important;
  }

  .auth-container,
  .login-container,
  .register-container {
    padding: 25px 18px !important;
  }

  .auth-container h1,
  .auth-container h2,
  .login-container h1,
  .login-container h2 {
    font-size: 20px !important;
    margin-bottom: 20px !important;
  }

  .auth-container input,
  .login-container input,
  .register-container input {
    padding: 10px 12px !important;
    font-size: 13px !important;
  }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // Transform navbar to sidebar
  const navbar = document.querySelector('nav.navbar');
  if (navbar) {
    navbar.style.position = 'fixed';
    navbar.style.left = '0';
    navbar.style.top = '0';
    navbar.style.width = '290px';
    navbar.style.height = '100vh';
    navbar.style.zIndex = '1050';
    navbar.style.display = 'flex';
    navbar.style.flexDirection = 'column';
    navbar.style.backgroundColor = '#0a1428';
    navbar.style.borderRight = '3px solid #00d4aa';
    navbar.style.overflowY = 'auto';
  }

  // Reposition main content
  const main = document.querySelector('main');
  if (main) {
    main.style.marginLeft = '0';
    main.style.marginTop = '0';
    main.style.width = 'auto';
  }

  // Transform nav items to vertical
  const navLinks = document.querySelectorAll('.navbar-nav .nav-link');
  navLinks.forEach(link => {
    link.style.display = 'flex';
    link.style.alignItems = 'center';
    link.style.width = '100%';
    link.style.padding = '14px 18px';
    link.style.borderLeft = '4px solid transparent';
    link.style.transition = 'all 0.3s ease';

    link.addEventListener('mouseenter', function() {
      this.style.backgroundColor = 'rgba(0, 212, 170, 0.15)';
      this.style.borderLeftColor = '#00d4aa';
      this.style.color = '#ffffff';
    });

    link.addEventListener('mouseleave', function() {
      if (!this.classList.contains('active')) {
        this.style.backgroundColor = '';
        this.style.borderLeftColor = 'transparent';
        this.style.color = '#e0e0e0';
      }
    });
  });

  // Handle mobile responsiveness
  function checkResponsive() {
    if (window.innerWidth <= 768) {
      navbar.style.width = '100%';
      navbar.style.height = 'auto';
      navbar.style.maxHeight = '65px';
      navbar.style.flexDirection = 'row';
    } else {
      navbar.style.width = '290px';
      navbar.style.height = '100vh';
      navbar.style.maxHeight = 'none';
      navbar.style.flexDirection = 'column';
    }
  }

  window.addEventListener('resize', checkResponsive);
  checkResponsive();
});
</script>
