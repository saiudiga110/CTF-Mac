{% extends "admin/base.html" %}
{% block title %}Container Health{% endblock %}
{% block content %}
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--green:#00ff41;--red:#ff4444;--yellow:#ffd700;--blue:#64b4ff;--text:#c9d1d9;--muted:#8b949e;}
body{background:var(--bg)!important;color:var(--text)!important;}
.ch-hdr{background:linear-gradient(135deg,#0d1117,#161b22);border-bottom:1px solid var(--border);padding:22px 0 16px;margin-bottom:24px;}
.ch-hdr h1{font-family:'Courier New',monospace;color:var(--green);font-size:1.5rem;letter-spacing:2px;margin:0;}
.ch-hdr p{color:var(--muted);font-size:.85rem;margin:4px 0 0;}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.btn-refresh{background:rgba(0,255,65,.1);color:var(--green);border:1px solid rgba(0,255,65,.3);border-radius:6px;padding:7px 18px;cursor:pointer;font-family:'Courier New',monospace;font-size:.82rem;}
.btn-refresh:hover{background:rgba(0,255,65,.2);}
.auto-badge{font-size:.72rem;color:var(--muted);font-family:'Courier New',monospace;}
.summary-row{display:flex;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
.summary-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 20px;min-width:120px;text-align:center;}
.summary-card .val{font-family:'Courier New',monospace;font-size:1.6rem;color:var(--green);}
.summary-card .lbl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
table{width:100%;border-collapse:collapse;}
th{font-family:'Courier New',monospace;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:8px 12px;border-bottom:1px solid var(--border);text-align:left;}
td{padding:10px 12px;border-bottom:1px solid rgba(48,54,61,.5);font-size:.84rem;vertical-align:middle;}
tr:hover td{background:rgba(0,255,65,.03);}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
.status-running{background:#00ff41;box-shadow:0 0 6px #00ff41;}
.status-exited{background:#ff4444;}
.status-other{background:#ffd700;}
.role-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.65rem;font-weight:700;font-family:'Courier New',monospace;}
.role-target{background:rgba(0,255,65,.1);color:var(--green);border:1px solid rgba(0,255,65,.25);}
.role-kali{background:rgba(100,180,255,.1);color:var(--blue);border:1px solid rgba(100,180,255,.25);}
.role-analytics{background:rgba(255,215,0,.1);color:var(--yellow);border:1px solid rgba(255,215,0,.25);}
.meter{width:80px;height:6px;background:rgba(255,255,255,.08);border-radius:3px;display:inline-block;vertical-align:middle;overflow:hidden;}
.meter-fill{height:100%;border-radius:3px;transition:width .4s;}
.meter-ok{background:#00ff41;}
.meter-warn{background:#ffd700;}
.meter-crit{background:#ff4444;}
.btn-kill{background:rgba(255,68,68,.1);color:var(--red);border:1px solid rgba(255,68,68,.25);border-radius:5px;padding:3px 10px;cursor:pointer;font-size:.72rem;font-family:'Courier New',monospace;}
.btn-kill:hover{background:rgba(255,68,68,.25);}
.btn-kill:disabled{opacity:.4;cursor:not-allowed;}
.empty{text-align:center;padding:50px;color:var(--muted);font-size:.9rem;}
.toast{position:fixed;bottom:22px;right:22px;background:var(--card);border:1px solid rgba(0,255,65,.3);border-radius:8px;padding:10px 18px;font-family:'Courier New',monospace;font-size:.82rem;color:var(--green);z-index:9999;display:none;}
</style>

<div class="ch-hdr">
  <div class="container">
    <h1>&#128187; Container Health</h1>
    <p>All active per-user Docker containers — RAM, CPU, and one-click kill.</p>
  </div>
</div>

<div class="container">
  <div class="toolbar">
    <button class="btn-refresh" onclick="load()">&#8635; Refresh</button>
    <span class="auto-badge" id="next-refresh">Auto-refresh in 15s</span>
  </div>

  <div class="summary-row">
    <div class="summary-card"><div class="val" id="s-total">—</div><div class="lbl">Containers</div></div>
    <div class="summary-card"><div class="val" id="s-users">—</div><div class="lbl">Users</div></div>
    <div class="summary-card"><div class="val" id="s-targets">—</div><div class="lbl">Targets</div></div>
    <div class="summary-card"><div class="val" id="s-kali">—</div><div class="lbl">Pwn Machines</div></div>
  </div>

  <div id="table-wrap">
    <div class="empty">Loading…</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var countdown = 15;
var timer = null;

function load() {
  countdown = 15;
  fetch('/api/ctf/admin/containers/health', {credentials:'same-origin'})
    .then(function(r){return r.json();})
    .then(render)
    .catch(function(e){toast('Error: '+e,'#ff4444');});
}

function render(rows) {
  if (!Array.isArray(rows)) { toast('Error loading containers','#ff4444'); return; }
  document.getElementById('s-total').textContent   = rows.length;
  document.getElementById('s-users').textContent   = new Set(rows.map(function(r){return r.username;})).size;
  document.getElementById('s-targets').textContent = rows.filter(function(r){return r.role==='target';}).length;
  document.getElementById('s-kali').textContent    = rows.filter(function(r){return r.role==='kali';}).length;

  if (!rows.length) {
    document.getElementById('table-wrap').innerHTML = '<div class="empty">No managed containers running.</div>';
    return;
  }

  var html = '<table><thead><tr><th>User</th><th>Role</th><th>Status</th><th>CPU %</th><th>RAM (MB)</th><th>Port</th><th>Expires</th><th>Action</th></tr></thead><tbody>';
  rows.forEach(function(r) {
    var cpuPct  = r.cpu_pct != null ? r.cpu_pct : null;
    var memPct  = r.mem_pct != null ? r.mem_pct : null;
    var cpuCls  = cpuPct == null ? '' : cpuPct > 80 ? 'meter-crit' : cpuPct > 50 ? 'meter-warn' : 'meter-ok';
    var memCls  = memPct == null ? '' : memPct > 80 ? 'meter-crit' : memPct > 60 ? 'meter-warn' : 'meter-ok';
    var statusDot = r.status === 'running' ? 'status-running' : r.status === 'exited' ? 'status-exited' : 'status-other';
    var roleCls = r.role === 'target' ? 'role-target' : r.role === 'kali' ? 'role-kali' : 'role-analytics';
    var exp = r.expires_at ? new Date(parseInt(r.expires_at)*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '—';
    html += '<tr>' +
      '<td style="font-family:monospace">'+esc(r.username)+'</td>' +
      '<td><span class="role-badge '+roleCls+'">'+esc(r.role)+'</span></td>' +
      '<td><span class="status-dot '+statusDot+'"></span>'+esc(r.status)+'</td>' +
      '<td>'+(cpuPct!=null?'<span class="meter"><span class="meter-fill '+cpuCls+'" style="width:'+Math.min(cpuPct,100)+'%"></span></span> '+cpuPct+'%':'—')+'</td>' +
      '<td>'+(r.mem_mb!=null?'<span class="meter"><span class="meter-fill '+memCls+'" style="width:'+Math.min(memPct,100)+'%"></span></span> '+r.mem_mb+' MB':'—')+'</td>' +
      '<td style="font-family:monospace">'+(r.port||'—')+'</td>' +
      '<td style="font-family:monospace">'+exp+'</td>' +
      '<td><button class="btn-kill" onclick="kill(this,\''+esc(r.name)+'\')">&#128465; Kill</button></td>' +
    '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('table-wrap').innerHTML = html;
}

function kill(btn, name) {
  if (!confirm('Kill container "'+name+'"?')) return;
  btn.disabled = true; btn.textContent = 'Killing…';
  fetch('/api/ctf/admin/containers/'+encodeURIComponent(name)+'/kill', {
    method:'DELETE', credentials:'same-origin',
    headers:{'CSRF-Token':getCsrf()}
  }).then(function(r){return r.json();})
    .then(function(d){
      if (d.success) { toast('Killed '+name,'#00ff41'); load(); }
      else { toast(d.error||'Error','#ff4444'); btn.disabled=false; btn.textContent='&#128465; Kill'; }
    }).catch(function(e){toast(''+e,'#ff4444'); btn.disabled=false;});
}

function getCsrf() {
  var m=document.querySelector('meta[name="csrf-token"]');
  return m ? m.getAttribute('content') : '';
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function toast(msg,col){
  var t=document.getElementById('toast');
  t.textContent=msg; t.style.color=col||'var(--green)'; t.style.display='block';
  clearTimeout(t._t); t._t=setTimeout(function(){t.style.display='none';},3000);
}

function tick() {
  countdown--;
  document.getElementById('next-refresh').textContent = 'Auto-refresh in '+countdown+'s';
  if (countdown <= 0) load();
}

load();
timer = setInterval(tick, 1000);
</script>
{% endblock %}
