{% extends "admin/base.html" %}
{% block title %}Challenge Leaderboard{% endblock %}
{% block content %}
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--green:#00ff41;--red:#ff4444;--yellow:#ffd700;--blue:#64b4ff;--text:#c9d1d9;--muted:#8b949e;}
body{background:var(--bg)!important;color:var(--text)!important;}
.lb-hdr{background:linear-gradient(135deg,#0d1117,#161b22);border-bottom:1px solid var(--border);padding:22px 0 16px;margin-bottom:24px;}
.lb-hdr h1{font-family:'Courier New',monospace;color:var(--green);font-size:1.5rem;letter-spacing:2px;margin:0;}
.lb-hdr p{color:var(--muted);font-size:.85rem;margin:4px 0 0;}
.controls{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
.search-inp{background:rgba(0,0,0,.4);border:1px solid rgba(0,255,65,.2);border-radius:6px;color:var(--text);font-family:'Courier New',monospace;font-size:.84rem;padding:7px 12px;outline:none;width:220px;}
.search-inp:focus{border-color:rgba(0,255,65,.4);}
.sort-btn{background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:6px 12px;cursor:pointer;font-size:.75rem;font-family:'Courier New',monospace;}
.sort-btn.active{background:rgba(0,255,65,.1);color:var(--green);border-color:rgba(0,255,65,.3);}
.chal-grid{display:grid;gap:14px;}
.chal-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .2s;}
.chal-card:hover{border-color:rgba(0,255,65,.25);}
.chal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;user-select:none;}
.chal-head:hover{background:rgba(0,255,65,.03);}
.chal-name{font-family:'Courier New',monospace;font-size:.9rem;color:var(--text);font-weight:700;}
.chal-meta{display:flex;gap:8px;align-items:center;}
.cat-badge{background:rgba(100,180,255,.1);color:var(--blue);border:1px solid rgba(100,180,255,.2);border-radius:10px;padding:2px 8px;font-size:.65rem;font-family:'Courier New',monospace;}
.pts-badge{background:rgba(255,215,0,.1);color:var(--yellow);border:1px solid rgba(255,215,0,.2);border-radius:10px;padding:2px 8px;font-size:.65rem;font-family:'Courier New',monospace;}
.solves-badge{background:rgba(0,255,65,.08);color:var(--green);border:1px solid rgba(0,255,65,.2);border-radius:10px;padding:2px 8px;font-size:.65rem;font-family:'Courier New',monospace;}
.fb-row{background:rgba(255,215,0,.05);border-bottom:1px solid var(--border);padding:8px 18px;font-size:.78rem;color:var(--yellow);font-family:'Courier New',monospace;}
.solver-table{width:100%;border-collapse:collapse;}
.solver-table th{font-family:'Courier New',monospace;font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:7px 18px;border-bottom:1px solid var(--border);text-align:left;}
.solver-table td{padding:8px 18px;font-size:.82rem;border-bottom:1px solid rgba(48,54,61,.4);}
.solver-table tr:last-child td{border-bottom:none;}
.rank-1 td:first-child{color:var(--yellow);}
.rank-2 td:first-child{color:#c0c0c0;}
.rank-3 td:first-child{color:#cd7f32;}
.chevron{float:right;transition:transform .25s;color:var(--muted);}
.expanded .chevron{transform:rotate(180deg);}
.solver-body{display:none;}
.solver-body.open{display:block;}
.empty{text-align:center;padding:50px;color:var(--muted);}
.load-more{background:rgba(0,255,65,.08);color:var(--green);border:1px solid rgba(0,255,65,.2);border-radius:6px;padding:6px 18px;cursor:pointer;font-family:'Courier New',monospace;font-size:.78rem;margin:8px 18px 12px;}
</style>

<div class="lb-hdr">
  <div class="container">
    <h1>&#127942; Challenge Leaderboard</h1>
    <p>Per-challenge solve rankings — who solved what, and when.</p>
  </div>
</div>

<div class="container">
  <div class="controls">
    <input class="search-inp" id="search" placeholder="Search challenges…" oninput="applyFilter()">
    <button class="sort-btn active" id="sort-solves" onclick="setSort('solves',this)">&#11015; Most Solved</button>
    <button class="sort-btn" id="sort-pts"    onclick="setSort('pts',this)">&#11015; Points</button>
    <button class="sort-btn" id="sort-name"   onclick="setSort('name',this)">A–Z Name</button>
  </div>
  <div class="chal-grid" id="chal-grid"><div class="empty">Loading…</div></div>
</div>

<script>
var allData = [];
var sortKey = 'solves';

function load() {
  fetch('/api/ctf/leaderboard/all-challenges',{credentials:'same-origin'})
    .then(function(r){return r.json();})
    .then(function(d){allData=d; applyFilter();})
    .catch(function(e){document.getElementById('chal-grid').innerHTML='<div class="empty">Error: '+e+'</div>';});
}

function setSort(k, btn) {
  sortKey = k;
  document.querySelectorAll('.sort-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  applyFilter();
}

function applyFilter() {
  var q = (document.getElementById('search').value || '').toLowerCase();
  var data = allData.filter(function(c){
    return !q || c.name.toLowerCase().indexOf(q)>=0 || (c.category||'').toLowerCase().indexOf(q)>=0;
  });
  if (sortKey === 'solves') data.sort(function(a,b){return b.solve_count-a.solve_count || a.name.localeCompare(b.name);});
  else if (sortKey === 'pts') data.sort(function(a,b){return b.points-a.points;});
  else data.sort(function(a,b){return a.name.localeCompare(b.name);});
  render(data);
}

function render(data) {
  if (!data.length) { document.getElementById('chal-grid').innerHTML='<div class="empty">No challenges found.</div>'; return; }
  document.getElementById('chal-grid').innerHTML = data.map(function(c,i){
    var fbHtml = c.first_blood
      ? '<div class="fb-row">&#127981; First blood: <strong>'+esc(c.first_blood)+'</strong>'+(c.first_blood_at?' at '+new Date(c.first_blood_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'')+'</div>'
      : '';
    var solversHtml = '';
    if (c.top_solvers && c.top_solvers.length) {
      solversHtml = '<table class="solver-table"><thead><tr><th>Rank</th><th>User</th><th>Time</th></tr></thead><tbody>';
      c.top_solvers.forEach(function(s,idx){
        var rankCls = idx===0?'rank-1':idx===1?'rank-2':idx===2?'rank-3':'';
        solversHtml += '<tr class="'+rankCls+'"><td>#'+(idx+1)+'</td><td>'+esc(s.username)+'</td><td style="font-family:monospace;font-size:.78rem">'+new Date(s.solved_at).toLocaleString()+'</td></tr>';
      });
      solversHtml += '</tbody></table>';
      if (c.solve_count > c.top_solvers.length) {
        solversHtml += '<button class="load-more" onclick="loadAll('+c.id+',this)">Show all '+c.solve_count+' solvers</button>';
      }
    } else {
      solversHtml = '<div class="empty" style="padding:20px">No solves yet.</div>';
    }
    return '<div class="chal-card" id="chal-'+c.id+'">'+
      '<div class="chal-head" onclick="toggle(\'chal-'+c.id+'\')">'+
        '<div>'+
          '<div class="chal-name">'+esc(c.name)+'</div>'+
        '</div>'+
        '<div class="chal-meta">'+
          '<span class="cat-badge">'+esc(c.category)+'</span>'+
          '<span class="pts-badge">'+c.points+'pts</span>'+
          '<span class="solves-badge">'+c.solve_count+' solve'+(c.solve_count!==1?'s':'')+'</span>'+
          '<span class="chevron">&#9660;</span>'+
        '</div>'+
      '</div>'+
      fbHtml+
      '<div class="solver-body" id="body-'+c.id+'">'+solversHtml+'</div>'+
    '</div>';
  }).join('');
}

function toggle(id) {
  var card = document.getElementById(id);
  var body = document.getElementById('body-'+id.replace('chal-',''));
  card.classList.toggle('expanded');
  body.classList.toggle('open');
}

function loadAll(chalId, btn) {
  btn.disabled = true; btn.textContent = 'Loading…';
  fetch('/api/ctf/leaderboard/challenge/'+chalId,{credentials:'same-origin'})
    .then(function(r){return r.json();})
    .then(function(rows){
      var html = '<table class="solver-table"><thead><tr><th>Rank</th><th>User</th><th>Time</th></tr></thead><tbody>';
      rows.forEach(function(r){
        var rankCls = r.rank===1?'rank-1':r.rank===2?'rank-2':r.rank===3?'rank-3':'';
        html += '<tr class="'+rankCls+'"><td>#'+r.rank+'</td><td>'+esc(r.username)+'</td><td style="font-family:monospace;font-size:.78rem">'+new Date(r.solved_at).toLocaleString()+'</td></tr>';
      });
      html += '</tbody></table>';
      btn.parentElement.innerHTML = html;
    }).catch(function(){btn.disabled=false; btn.textContent='Error — retry';});
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

load();
</script>
{% endblock %}
