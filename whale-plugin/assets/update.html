<form method="POST">
	<div class="form-group">
		<label for="name">Name<br>
			<small class="form-text text-muted">The name of your challenge</small>
		</label>
		<input type="text" class="form-control chal-name" name="name" value="{{ challenge.name }}">
	</div>

	<div class="form-group">
		<label for="category">Category<br>
			<small class="form-text text-muted">The category of your challenge</small>
		</label>
		<input type="text" class="form-control chal-category" name="category" value="{{ challenge.category }}">
	</div>

	<ul class="nav nav-tabs" role="tablist" id="desc-edit">
		<li class="nav-item">
			<a class="nav-link active" href="#desc-write" id="desc-write-link" aria-controls="home" role="tab"
				data-toggle="tab">Write</a>
		</li>
		<li class="nav-item">
			<a class="nav-link" href="#desc-preview" aria-controls="home" role="tab" data-toggle="tab">Preview</a>
		</li>
	</ul>
	<div class="tab-content">
		<div role="tabpanel" class="tab-pane active" id="desc-write">
			<div class="form-group">
				<label for="message-text" class="control-label">Description<br>
					<small class="form-text text-muted">Give a brief introduction to your challenge.</small>
				</label>
				<textarea id="desc-editor" class="form-control chal-desc-editor" name="description"
					rows="10">{{ challenge.description }}</textarea>
			</div>
		</div>
		<div role="tabpanel" class="tab-pane content" id="desc-preview" style="height:214px; overflow-y: scroll;"></div>
	</div>

	<div class="form-group">
		<label>Current Value<br>
			<small class="form-text text-muted">How many points the challenge is worth right now.</small>
		</label>
		<input type="number" class="form-control chal-value" name="value" value="{{ challenge.value }}" disabled>
	</div>

	<div class="form-group">
		<label>Initial Value<br>
			<small class="form-text text-muted">How many points the challenge was worth initially.</small>
		</label>
		<input type="number" class="form-control chal-initial" name="initial" value="{{ challenge.initial }}" required>
	</div>

	<div class="form-group">
		<label>Decay Limit<br>
			<small class="form-text text-muted">Number of solves before the challenge reaches its minimum value</small>
		</label>
		<input type="number" class="form-control chal-decay" name="decay" value="{{ challenge.decay }}" required>
	</div>

	<div class="form-group">
		<label>Required Flags<br>
			<small class="form-text text-muted">Number of unique flags required to solve the challenge</small>
		</label>
		<input type="number" class="form-control chal-flags-required" name="flags_required"
			value="{{ challenge.flags_required }}" min="1" required>
	</div>

	<div class="form-group">
		<label>Minimum Value<br>
			<small class="form-text text-muted">The lowest the challenge can be worth</small>
		</label>
		<input type="number" class="form-control chal-minimum" name="minimum" value="{{ challenge.minimum }}" required>
	</div>

	<div class="form-group">
		<label>Max Attempts<br>
			<small class="form-text text-muted">Maximum attempts users receive. 0 for unlimited.</small>
		</label>
		<input type="number" class="form-control chal-attempts" name="max_attempts"
			value="{{ challenge.max_attempts }}">
	</div>

	<div class="form-group">
		<label>State<br>
			<small class="form-text text-muted">Visible or hidden from players</small>
		</label>
		<select class="form-control" name="state">
			<option value="visible" {% if challenge.state=="visible" %}selected{% endif %}>Visible</option>
			<option value="hidden" {% if challenge.state=="hidden" %}selected{% endif %}>Hidden</option>
		</select>
	</div>

	<div class="form-group">
		<label>🐳 Docker Image<br>
			<small class="form-text text-muted">Select an existing image or type a custom image name</small>
		</label>
		<select class="form-control" name="docker_image" id="docker-image-select-update" required>
			<option value="{{ challenge.docker_image }}" selected>{{ challenge.docker_image }} (current)</option>
		</select>
		<input type="text" class="form-control mt-2" id="docker-image-custom-update"
			placeholder="Or type a custom image name" style="display:none;">
		<small class="form-text">
			<a href="#" id="toggle-custom-image-update" style="color: #007bff;">Switch to custom input</a>
		</small>
	</div>

	<div class="form-group">
		<label>Redirect Type<br>
			<small class="form-text text-muted">How traffic is routed to the container</small>
		</label>
		<select class="form-control" name="redirect_type">
			<option value="direct" {% if challenge.redirect_type=="direct" %}selected{% endif %}>Direct (Port Mapping)
			</option>
			<option value="http" {% if challenge.redirect_type=="http" %}selected{% endif %}>HTTP</option>
		</select>
	</div>

	<div class="form-group">
		<label>Redirect Port<br>
			<small class="form-text text-muted">The port inside the container to expose</small>
		</label>
		<input type="number" class="form-control" name="redirect_port" placeholder="Enter container port" required
			value="{{ challenge.redirect_port }}">
	</div>

	<div class="form-group">
		<label>Memory Limit<br>
			<small class="form-text text-muted">Container memory limit (e.g. 128m, 256m, 1g)</small>
		</label>
		<input type="text" class="form-control" name="memory_limit" placeholder="Enter memory limit"
			value="{{ challenge.memory_limit }}" required>
	</div>

	<div class="form-group">
		<label>CPU Limit<br>
			<small class="form-text text-muted">CPU cores allocated (e.g. 0.5 = half a core)</small>
		</label>
		<input type="number" class="form-control" name="cpu_limit" placeholder="Enter CPU limit"
			value="{{ challenge.cpu_limit }}" step="0.1" required>
	</div>

	<div class="form-group">
		<label>Score Type<br>
			<small class="form-text text-muted">Dynamic score decreases as more players solve it</small>
		</label>
		<select class="form-control" name="dynamic_score">
			<option value="0" {% if challenge.dynamic_score==0 %}selected{% endif %}>Static Score</option>
			<option value="1" {% if challenge.dynamic_score==1 %}selected{% endif %}>Dynamic Score</option>
		</select>
	</div>

	<div>
		<button class="btn btn-success btn-outlined float-right" type="submit">Update</button>
	</div>
</form>

<script>
	(function () {
		var select = document.getElementById('docker-image-select-update');
		var customInput = document.getElementById('docker-image-custom-update');
		var toggleLink = document.getElementById('toggle-custom-image-update');
		var currentImage = '{{ challenge.docker_image }}';
		var usingCustom = false;

		if (typeof CTFd !== 'undefined' && CTFd.fetch) {
			CTFd.fetch('/plugins/ctfd-whale/admin/images', {
				method: 'GET',
				credentials: 'same-origin',
				headers: { 'Accept': 'application/json' }
			}).then(function (r) { return r.json(); })
				.then(function (data) {
					if (data.success && data.data.length > 0) {
						select.innerHTML = '';
						var foundCurrent = false;
						data.data.forEach(function (img) {
							var opt = document.createElement('option');
							opt.value = img.tag;
							opt.textContent = img.tag + ' (' + img.size + ' MB)';
							if (img.tag === currentImage) {
								opt.selected = true;
								foundCurrent = true;
							}
							select.appendChild(opt);
						});
						if (!foundCurrent && currentImage) {
							var opt = document.createElement('option');
							opt.value = currentImage;
							opt.textContent = currentImage + ' (current - not found on host)';
							opt.selected = true;
							select.insertBefore(opt, select.firstChild);
						}
					}
				}).catch(function () { });
		}

		toggleLink.addEventListener('click', function (e) {
			e.preventDefault();
			usingCustom = !usingCustom;
			if (usingCustom) {
				select.style.display = 'none';
				select.removeAttribute('name');
				customInput.style.display = 'block';
				customInput.setAttribute('name', 'docker_image');
				customInput.value = currentImage;
				toggleLink.textContent = 'Switch to dropdown';
			} else {
				select.style.display = 'block';
				select.setAttribute('name', 'docker_image');
				customInput.style.display = 'none';
				customInput.removeAttribute('name');
				toggleLink.textContent = 'Switch to custom input';
			}
		});
	})();
</script>
