<div class="form-group">
    <label for="content">Flag</label>
    <input type="text" class="form-control" name="content" id="content" placeholder="Flag Content" required>
</div>

<div class="form-group">
    <label for="data">Flag Order</label>
    <input type="number" class="form-control" name="data" id="data" placeholder="Order (e.g. 1)" min="1" required>
    <small class="form-text text-muted">
        Determines the sequence of this flag. 1 = First flag to solve, 2 = Second, etc.
    </small>
</div>
