<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ ctf_name }} — live board</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: ui-sans-serif, system-ui, Segoe UI, sans-serif;
      background: #070b14;
      color: #e2e8f0;
      padding: 28px 36px 40px;
    }
    header { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 28px; }
    h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.6rem); letter-spacing: -0.03em; }
    .phase { font-size: clamp(1.1rem, 2.4vw, 1.6rem); font-weight: 700; color: #34d399; }
    .phase.is-paused, .phase.is-ended { color: #f87171; }
    .phase.is-countdown { color: #fbbf24; }
    .clock { font-variant-numeric: tabular-nums; font-size: clamp(2.4rem, 8vw, 5.4rem); font-weight: 750; letter-spacing: -0.04em; line-height: 1; }
    .msg { min-height: 1.4em; color: #94a3b8; font-size: 1.15rem; margin: 8px 0 28px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
    .stat { background: #0f172a; border: 1px solid rgba(148,163,184,0.14); border-radius: 16px; padding: 18px 20px; }
    .stat strong { display: block; font-size: clamp(1.8rem, 4vw, 2.6rem); }
    .stat span { color: #94a3b8; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.78rem; }
    table { width: 100%; border-collapse: collapse; font-size: clamp(1rem, 2vw, 1.35rem); }
    th { text-align: left; color: #64748b; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 8px 10px; }
    td { padding: 10px; border-top: 1px solid rgba(148,163,184,0.1); }
    td.rank { width: 4rem; color: #94a3b8; }
    td.score { text-align: right; font-variant-numeric: tabular-nums; color: #6ee7b7; font-weight: 700; }
    .empty { color: #64748b; padding: 24px 10px; }
    @media (max-width: 720px) {
      body { padding: 16px; }
      header { flex-direction: column; align-items: flex-start; }
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="name">{{ ctf_name }}</h1>
      <div class="phase" id="phase">Loading</div>
    </div>
    <div class="clock" id="clock">--:--:--</div>
  </header>
  <p class="msg" id="msg"></p>
  <div class="stats">
    <div class="stat"><strong id="players">—</strong><span>Players</span></div>
    <div class="stat"><strong id="solves">—</strong><span>Solves</span></div>
    <div class="stat"><strong id="recent">—</strong><span>Last 15 min</span></div>
  </div>
  <table>
    <thead><tr><th>Rank</th><th>Player</th><th style="text-align:right">Score</th></tr></thead>
    <tbody id="rows"><tr><td class="empty" colspan="3">Waiting for solves…</td></tr></tbody>
  </table>
  <script>
  (function () {
    var token = new URLSearchParams(location.search).get('k') || '';
    function fmt(seconds) {
      if (seconds < 0) seconds = 0;
      var h = Math.floor(seconds / 3600);
      var m = Math.floor((seconds % 3600) / 60);
      var s = seconds % 60;
      return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }
    function paint(d) {
      document.getElementById('name').textContent = d.name || 'Lloyds CTF';
      var phase = document.getElementById('phase');
      var clock = document.getElementById('clock');
      var now = d.now || Math.floor(Date.now() / 1000);
      phase.className = 'phase is-' + (d.phase || 'live');
      if (d.phase === 'countdown' && d.start) {
        phase.textContent = 'Starts in';
        clock.textContent = fmt(d.start - now);
      } else if (d.phase === 'live' && d.end) {
        phase.textContent = d.frozen ? 'Live · scoreboard frozen' : 'Live';
        clock.textContent = fmt(d.end - now);
      } else if (d.phase === 'paused') {
        phase.textContent = 'Paused';
        clock.textContent = d.end ? fmt(Math.max(0, d.end - now)) : 'PAUSED';
      } else if (d.phase === 'ended') {
        phase.textContent = 'Event over';
        clock.textContent = '00:00:00';
      } else {
        phase.textContent = d.paused ? 'Paused' : 'Live';
        clock.textContent = '--:--:--';
      }
      document.getElementById('msg').textContent = d.message || '';
      document.getElementById('players').textContent = d.players != null ? d.players : '—';
      document.getElementById('solves').textContent = d.solves != null ? d.solves : '—';
      document.getElementById('recent').textContent = d.solves_15m != null ? d.solves_15m : '—';
      var rows = document.getElementById('rows');
      var standings = d.standings || [];
      if (!standings.length) {
        rows.innerHTML = '<tr><td class="empty" colspan="3">Waiting for solves…</td></tr>';
        return;
      }
      rows.innerHTML = standings.map(function (s, i) {
        return '<tr><td class="rank">' + (s.rank || (i + 1)) + '</td><td>' +
          String(s.name || '').replace(/&/g,'&amp;').replace(/</g,'&lt;') +
          '</td><td class="score">' + (s.score || 0) + '</td></tr>';
      }).join('');
    }
    function tick() {
      var url = '/plugins/ctfd-target/board.json' + (token ? ('?k=' + encodeURIComponent(token)) : '');
      fetch(url, { credentials: 'omit' })
        .then(function (r) { if (!r.ok) throw new Error('denied'); return r.json(); })
        .then(paint)
        .catch(function () {});
    }
    tick();
    setInterval(tick, 5000);
  })();
  </script>
</body>
</html>
