<div class="mb-3">
    <label class="form-label fw-bold">Challenge Key <span class="text-danger">*</span></label>
    <input class="form-control" name="content" type="text"
           placeholder="e.g. sqli_login"
           required pattern="[a-z0-9_]+"
           title="Lowercase letters, digits, underscores only">
    <div class="form-text">
        The internal challenge identifier used in the HMAC formula:
        <code>LYD{hmac_sha256(FLAG_SECRET, "&lt;team_id&gt;:&lt;key&gt;")[:24]}</code>.
        Must match the key passed to <code>make_flag()</code> in vBank.
    </div>
</div>
