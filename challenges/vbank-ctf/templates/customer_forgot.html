<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — vBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7fb; font-family: 'Segoe UI', system-ui, sans-serif; }
        .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .login-card { background: #fff; border-radius: 14px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 40px; width: 100%; max-width: 420px; }
        .brand { text-align: center; margin-bottom: 28px; }
        .brand-logo { width: 52px; height: 52px; background: #1565c0; border-radius: 14px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.4rem; }
        .brand-name { font-size: 1.5rem; font-weight: 800; color: #1565c0; }
        .brand-sub  { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }
        .form-label { font-size: 0.8rem; font-weight: 600; color: #64748b; }
        .form-control { border-color: #e1e8ef; font-size: 0.875rem; }
        .form-control:focus { border-color: #1565c0; box-shadow: 0 0 0 3px rgba(21,101,192,0.12); }
        .btn-primary { background: #1565c0; border-color: #1565c0; font-weight: 600; }
        .btn-primary:hover { background: #0d47a1; border-color: #0d47a1; }
        .alert-dev { background: #fffbeb; border: 1px solid #f59e0b; color: #92400e; border-left: 4px solid #f59e0b; font-size: 0.78rem; border-radius: 8px; }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <div class="brand">
            <div class="brand-logo"><i class="fas fa-university"></i></div>
            <div class="brand-name">vBank</div>
            <div class="brand-sub">PASSWORD RECOVERY</div>
        </div>

        <div class="alert alert-dev mb-4">
            <i class="fas fa-exclamation-triangle me-1"></i>
            <strong>Dev Note (Jake):</strong> Reset tokens generated from username — must switch to random before prod. TD-633.
        </div>

        {% if sent %}
        <div class="alert alert-success mb-4" style="font-size:0.84rem;">
            <i class="fas fa-envelope me-2"></i>
            If that username exists, a reset link has been sent.<br>
            <span style="font-family:monospace; font-size:0.78rem; color:#4b5563;">
                (Dev shortcut: token = md5(username)[:12]. Use <a href="/customer/reset">/customer/reset?token=&lt;token&gt;</a>)
            </span>
        </div>
        {% endif %}

        <form method="POST" action="/customer/forgot">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
        </form>

        <div class="text-center mt-3" style="font-size:0.8rem; color:#94a3b8;">
            <a href="/customer/login" style="color:#1565c0; text-decoration:none;">Back to Login</a>
        </div>
    </div>
</div>
</body>
</html>
