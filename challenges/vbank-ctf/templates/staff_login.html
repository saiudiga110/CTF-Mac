<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vBank Internal Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #0d1b2a; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
        .login-card { background: #1a2b3c; border: 1px solid #2a3f55; border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .portal-icon { width: 56px; height: 56px; background: linear-gradient(135deg, #1565c0, #0d47a1); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem; }
        .portal-icon i { color: #fff; font-size: 1.4rem; }
        h4 { color: #e2e8f0; font-weight: 700; text-align: center; margin-bottom: 0.25rem; }
        .subtitle { color: #64748b; font-size: 0.8rem; text-align: center; margin-bottom: 1.75rem; }
        .form-label { color: #94a3b8; font-size: 0.8rem; font-weight: 500; }
        .form-control { background: #0d1b2a; border: 1px solid #2a3f55; color: #e2e8f0; border-radius: 8px; padding: 0.6rem 0.9rem; font-family: monospace; font-size: 0.88rem; }
        .form-control:focus { background: #0d1b2a; border-color: #1565c0; color: #e2e8f0; box-shadow: 0 0 0 3px rgba(21,101,192,0.2); }
        .form-control::placeholder { color: #475569; }
        .btn-login { background: linear-gradient(135deg, #1565c0, #0d47a1); border: none; color: #fff; font-weight: 600; border-radius: 8px; padding: 0.65rem; width: 100%; font-size: 0.9rem; margin-top: 0.5rem; }
        .btn-login:hover { background: linear-gradient(135deg, #1976d2, #1565c0); color: #fff; }
        .alert-danger { background: rgba(220,53,69,0.15); border: 1px solid rgba(220,53,69,0.35); color: #f87171; border-radius: 8px; font-size: 0.82rem; }
        .warning-bar { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.25); border-radius: 8px; padding: 0.6rem 0.9rem; margin-bottom: 1.5rem; font-size: 0.75rem; color: #fbbf24; }
        .footer-note { color: #334155; font-size: 0.72rem; text-align: center; margin-top: 1.5rem; }
        .back-link { color: #475569; font-size: 0.78rem; text-align: center; margin-top: 1rem; display: block; text-decoration: none; }
        .back-link:hover { color: #64748b; }
    </style>
</head>
<body>
<!-- [INTERNAL BUILD] Staff portal staging token: {{ flag1 }} — Jake: rotate before prod -->
<div class="login-card">
    <div class="portal-icon"><i class="fas fa-shield-alt"></i></div>
    <h4>vBank Internal Staff Portal</h4>
    <p class="subtitle">Authorised Personnel Only &nbsp;|&nbsp; IT Dept</p>

    <div class="warning-bar">
        <i class="fas fa-exclamation-triangle me-1"></i>
        This system is for authorised vBank employees only. All access is monitored and logged.
    </div>

    {% if error %}
    <div class="alert alert-danger mb-3"><i class="fas fa-times-circle me-2"></i>{{ error }}</div>
    {% endif %}

    <form method="POST" action="/staff-portal">
        <div class="mb-3">
            <label class="form-label">Employee ID</label>
            <input type="text" name="emp_id" class="form-control" placeholder="e.g. EMP-0042" autocomplete="off" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="emp_pass" class="form-control" placeholder="••••••••••" required>
        </div>
        <button type="submit" class="btn-login btn"><i class="fas fa-sign-in-alt me-2"></i>Sign In</button>
    </form>

    <a href="/" class="back-link"><i class="fas fa-arrow-left me-1"></i>Back to public site</a>
    <p class="footer-note">vBank Internal Systems &copy; 2024 &nbsp;|&nbsp; Build v2.4.1-staging</p>
</div>
</body>
</html>
